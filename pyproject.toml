[project]
name = "code-indexer"
version = "3.0.0"
description = "Full-stack code generation system with semantic indexing"
requires-python = ">=3.11"
dependencies = [
    # Parsing
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "tree-sitter-rust>=0.21.0",
    "tree-sitter-java>=0.21.0",
    
    # Embeddings
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    "sentence-transformers>=2.2.0",
    
    # Vector stores
    "chromadb>=0.4.0",
    "numpy>=1.24.0",
    
    # Real-time
    "watchfiles>=0.21.0",
    
    # Storage
    "diskcache>=5.6.0",
    
    # CLI
    "typer>=0.9.0",
    "rich>=13.0.0",
    
    # NEW: LLM Integration
    "anthropic>=0.18.0",
    "langchain>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-openai>=0.1.0",
    
    # NEW: Template Engine
    "jinja2>=3.1.0",
    
    # NEW: Validation
    "pydantic>=2.0.0",
    
    # NEW: Code formatting
    "black>=24.0.0",
    "isort>=5.12.0",
    "prettier-py>=0.1.0",
]

[project.optional-dependencies]
langraph = ["langgraph>=0.0.26"]

[project.scripts]
indexer = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.isort]
profile = "black"
line_length = 88